<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BusReservationSystem – Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <a class="brand" href="index.html"><span>🚌</span> BusReservationSystem</a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <!-- ===== SIGNUP FORM ===== -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Create account 🚀</h2>
      <p class="subtitle">Register to start booking bus tickets.</p>

      <!-- Error / Success message area -->
      <div id="msg-box"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password <small style="color:var(--muted)">(min 6 characters)</small></label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" id="signup-btn" style="width:100%">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>

</body>
</html>
